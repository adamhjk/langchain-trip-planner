[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-trip-planner"
version = "0.1.0"
description = "An LLM-controlled LangGraph trip planning agent with SearchAPI search"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-anthropic>=1.7.5,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "pycountry>=24.6,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
trip-planner = "trip_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
